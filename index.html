<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CENTRAL - CEN.11.05#5</title>
    
    <!-- BIBLIOTECAS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080808;
            color: #FFFFFF;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* Grade 2x2 para Mobile */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 15px;
        }

        /* Card Compacto */
        .card-app {
            background-color: #121214;
            border: 1px solid #1c1c1e;
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transition: transform 0.2s active;
        }

        .card-app:active {
            transform: scale(0.95);
        }

        .card-gradient {
            position: absolute;
            inset: 0;
            opacity: 0.08;
            pointer-events: none;
            border-radius: 24px;
        }

        .app-icon-box {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 10px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        .app-name {
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .app-version {
            font-size: 9px;
            font-weight: 600;
            color: #555558;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        /* Botão Abrir */
        .btn-abrir {
            width: 100%;
            padding: 8px 0;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            transition: filter 0.2s;
        }

        .btn-abrir:active {
            filter: brightness(1.2);
        }

        /* Modais */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }

        .modal-active { display: flex; }

        .modal-content {
            background-color: #121214;
            width: 100%;
            max-width: 350px;
            border-radius: 32px;
            border: 1px solid #1c1c1e;
            padding: 25px;
        }

        /* Iframe Preview */
        #preview-container {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background-color: #000;
            flex-direction: column;
        }

        .preview-nav {
            height: 60px;
            background-color: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border-bottom: 1px solid #1c1c1e;
        }

        iframe {
            flex: 1;
            width: 100vw;
            height: calc(100vh - 60px);
            border: none;
            background-color: white;
        }

        /* Inputs */
        .input-style {
            background-color: #080808;
            border: 1px solid #1c1c1e;
            border-radius: 14px;
            padding: 12px 15px;
            width: 100%;
            font-size: 14px;
            margin-bottom: 10px;
            outline: none;
        }

        .input-style:focus { border-color: #FFC300; }

        /* Scrollbar Oculta */
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 z-[300] bg-[#080808] flex flex-col items-center justify-center p-8">
        <h1 class="text-4xl font-black tracking-tighter mb-1">CENTRAL</h1>
        <p class="text-[10px] text-[#444] font-bold uppercase tracking-[0.3em] mb-12">Selecione uma ferramenta para começar</p>
        
        <div class="w-full max-w-xs space-y-3">
            <input type="email" id="login-email" placeholder="E-mail" class="input-style">
            <input type="password" id="login-password" placeholder="Senha" class="input-style">
            <button id="btn-entrar" class="w-full bg-[#FFC300] text-black font-black py-4 rounded-2xl text-sm shadow-xl">ENTRAR</button>
            <p id="login-error" class="text-red-500 text-[10px] font-bold text-center mt-2 hidden"></p>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="main-content" class="hidden">
        <header class="p-6 pt-10 text-center relative">
            <h1 class="text-4xl font-black tracking-tighter">CENTRAL</h1>
            <p class="text-[10px] text-[#333] font-bold uppercase tracking-[0.2em]">Versão CEN.11.05#5</p>
            
            <!-- Botão Logout (Setinha) -->
            <button id="btn-logout" class="absolute top-10 right-6 text-[#222] hover:text-white transition-colors">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            </button>
        </header>

        <div id="apps-container" class="apps-grid">
            <!-- Os aplicativos serão carregados aqui -->
        </div>

        <!-- Botão Novo Registro -->
        <button onclick="openModal('add')" class="mx-auto mt-4 mb-10 flex items-center gap-2 bg-[#121214] border border-[#1c1c1e] px-5 py-2.5 rounded-full text-[10px] font-black text-[#444] hover:text-[#FFC300] transition-all">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            NOVO REGISTRO
        </button>
    </div>

    <!-- MODAL ADICIONAR/EDITAR -->
    <div id="modal-app" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modal-title" class="text-lg font-black tracking-tight">REGISTRAR</h2>
                <button onclick="closeModal()" class="text-[#333]"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <input type="hidden" id="form-id">
            <input type="text" id="form-name" placeholder="Nome do App" class="input-style">
            <input type="text" id="form-version" placeholder="Versão (ex: 1.0.0)" class="input-style">
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="form-icon" placeholder="Emoji" class="input-style text-center">
                <input type="color" id="form-color" value="#FFC300" class="w-full h-[46px] bg-[#080808] border border-[#1c1c1e] rounded-xl p-1 mb-[10px]">
            </div>
            <textarea id="form-code" placeholder="Código HTML..." class="input-style h-32 resize-none text-[10px] font-mono"></textarea>
            <button id="btn-save" class="w-full bg-[#FFC300] text-black font-black py-4 rounded-2xl text-sm mt-2">SALVAR NA NUVEM</button>
        </div>
    </div>

    <!-- MODAL DELETE -->
    <div id="modal-delete" class="modal-overlay">
        <div class="modal-content text-center">
            <h2 class="text-xl font-black mb-2">REMOVER?</h2>
            <p class="text-[10px] text-[#444] mb-8 font-bold uppercase">Essa ação é permanente</p>
            <div class="grid grid-cols-2 gap-3">
                <button id="btn-confirm-delete" class="bg-red-600 text-white font-black py-3 rounded-xl text-xs uppercase">Sim</button>
                <button onclick="closeModal()" class="bg-[#1c1c1e] text-[#444] font-black py-3 rounded-xl text-xs uppercase">Não</button>
            </div>
        </div>
    </div>

    <!-- PREVIEW CONTAINER -->
    <div id="preview-container">
        <div class="preview-nav">
            <button onclick="closePreview()" class="w-10 h-10 flex items-center justify-center bg-[#1c1c1e] rounded-xl text-[#666]">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <h3 id="preview-title" class="text-[10px] font-black text-[#222] uppercase tracking-widest">EXECUTANDO</h3>
            <button onclick="restartApp()" class="w-10 h-10 flex items-center justify-center bg-[#1c1c1e] rounded-xl text-[#666]">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
            </button>
        </div>
        <iframe id="preview-iframe" sandbox="allow-scripts allow-forms allow-modals allow-downloads allow-popups allow-same-origin"></iframe>
    </div>

    <script>
        // --- CONFIGURAÇÃO ---
        const firebaseConfig = {
            apiKey: "AIzaSyBBbZuyTEhC_Epg8REPG-NrfWroXfAD9oM",
            authDomain: "central-308c6.firebaseapp.com",
            projectId: "central-308c6",
            storageBucket: "central-308c6.firebasestorage.app",
            messagingSenderId: "138784220121",
            appId: "1:138784220121:web:1329f218be8857e3faafc8"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const path = "central-308c6";

        let userUid = null;
        let lastCode = "";
        let delId = null;

        // --- AUTENTICAÇÃO ---
        auth.onAuthStateChanged(u => {
            if(u) {
                userUid = u.uid;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                load();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('main-content').classList.add('hidden');
            }
        });

        document.getElementById('btn-entrar').onclick = async () => {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-password').value;
            try { 
                await auth.signInWithEmailAndPassword(e, p); 
            } catch(err) { 
                const errEl = document.getElementById('login-error');
                errEl.innerText = "Credenciais inválidas.";
                errEl.classList.remove('hidden');
            }
        };

        document.getElementById('btn-logout').onclick = () => auth.signOut();

        // --- GERENCIAMENTO DE DADOS ---
        function load() {
            const container = document.getElementById('apps-container');
            
            // ALTERAÇÃO V5: .orderBy('createdAt', 'asc') garante que os antigos fiquem no topo
            db.collection('artifacts').doc(path).collection('users').doc(userUid).collection('my-apps')
              .orderBy('createdAt', 'asc') 
              .onSnapshot(snap => {
                  container.innerHTML = '';
                  snap.forEach(doc => {
                      const app = doc.data();
                      const id = doc.id;
                      const card = document.createElement('div');
                      card.className = 'card-app';
                      card.innerHTML = `
                          <div class="card-gradient" style="background: linear-gradient(135deg, ${app.color}, transparent 100%)"></div>
                          <div class="absolute top-3 right-3 flex gap-2">
                             <button onclick="edit('${id}', \`${encodeURIComponent(JSON.stringify(app))}\`)" class="opacity-10 hover:opacity-100 transition-opacity"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
                             <button onclick="preDelete('${id}')" class="opacity-10 hover:opacity-100 transition-opacity"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg></button>
                          </div>
                          <div class="app-icon-box" style="background-color: ${app.color}20; color: ${app.color}">${app.icon || '🚀'}</div>
                          <h3 class="app-name">${app.name}</h3>
                          <p class="app-version">Versão ${app.version || '1.0'}</p>
                          <button onclick="run(\`${encodeURIComponent(app.code)}\`, '${app.name}')" class="btn-abrir" style="background-color: ${app.color}; color: ${isLight(app.color) ? '#000' : '#fff'}">Abrir</button>
                      `;
                      container.appendChild(card);
                  });
              }, error => {
                  console.error("Erro ao carregar apps:", error);
              });
        }

        // Verifica se a cor é clara para decidir se o texto do botão deve ser preto ou branco
        function isLight(color) {
            const hex = color.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            return ((r * 299) + (g * 587) + (b * 114)) / 1000 > 155;
        }

        document.getElementById('btn-save').onclick = async () => {
            const id = document.getElementById('form-id').value;
            const data = {
                name: document.getElementById('form-name').value,
                version: document.getElementById('form-version').value,
                icon: document.getElementById('form-icon').value,
                color: document.getElementById('form-color').value,
                code: document.getElementById('form-code').value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            
            if(!data.name || !data.code) return;
            
            const ref = db.collection('artifacts').doc(path).collection('users').doc(userUid).collection('my-apps');
            
            try {
                if(id) { 
                    delete data.createdAt; // Mantém a data original na edição
                    await ref.doc(id).update(data); 
                } else { 
                    await ref.add(data); 
                }
                closeModal();
            } catch(e) {
                console.error("Erro ao salvar:", e);
                alert("Erro ao salvar. Verifique as permissões.");
            }
        };

        function edit(id, enc) {
            const a = JSON.parse(decodeURIComponent(enc));
            document.getElementById('form-id').value = id;
            document.getElementById('form-name').value = a.name;
            document.getElementById('form-version').value = a.version;
            document.getElementById('form-icon').value = a.icon;
            document.getElementById('form-color').value = a.color;
            document.getElementById('form-code').value = a.code;
            openModal('edit');
        }

        function preDelete(id) { delId = id; document.getElementById('modal-delete').classList.add('modal-active'); }
        
        document.getElementById('btn-confirm-delete').onclick = async () => { 
            if(delId) { 
                await db.collection('artifacts').doc(path).collection('users').doc(userUid).collection('my-apps').doc(delId).delete(); 
                closeModal(); 
            } 
        };

        function openModal(t) { 
            document.getElementById('modal-title').innerText = t === 'add' ? 'REGISTRAR' : 'EDITAR';
            if(t === 'add') {
                document.getElementById('form-id').value = "";
                document.getElementById('form-name').value = "";
                document.getElementById('form-code').value = "";
                document.getElementById('form-version').value = "1.0.0";
            }
            document.getElementById('modal-app').classList.add('modal-active'); 
        }
        
        function closeModal() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('modal-active')); }

        // --- MOTOR DE PREVIEW ---
        function run(enc, name) {
            const c = decodeURIComponent(enc);
            lastCode = c;
            const b = new Blob([c], { type: 'text/html' });
            const u = URL.createObjectURL(b);
            document.getElementById('preview-title').innerText = name.toUpperCase();
            document.getElementById('preview-iframe').src = u;
            document.getElementById('preview-container').style.display = 'flex';
        }
        
        function closePreview() { document.getElementById('preview-iframe').src = ""; document.getElementById('preview-container').style.display = 'none'; }
        
        function restartApp() {
            const b = new Blob([lastCode], { type: 'text/html' });
            document.getElementById('preview-iframe').src = URL.createObjectURL(b);
        }
    </script>
</body>
</html>
